name: Free source collection probe (manual, no publishing)
on:
  push:
    branches:
      - test/free-source-collector-20261026
    paths:
      - '.github/workflows/free-source-probe.yml'
      - 'scripts/free_source_probe.py'
      - 'scripts/verify_free_candidates.py'
      - 'scripts/build_free_review_queue.py'
      - 'scripts/build_site_preview.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect candidate metadata without paid API
        run: python scripts/free_source_probe.py > free_source_probe_result.json
      - name: Verify source pages and image links
        run: python scripts/verify_free_candidates.py free_source_probe_result.json
      - name: Build non-publishing review queue
        run: python scripts/build_free_review_queue.py free_source_verification_result.json
      - name: Generate blocked site-schema preview
        run: python scripts/build_site_preview.py free_source_review_queue.json
      - name: Store test-only result
        uses: actions/upload-artifact@v4
        with:
          name: free-source-probe-result
          path: |
            free_source_probe_result.json
            free_source_verification_result.json
            free_source_review_queue.json
            free_source_site_preview.json
          retention-days: 3
