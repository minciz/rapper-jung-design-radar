name: Prune 30-day archive
on:
  schedule:
    - cron: '20 15 * * *' # 00:20 KST daily
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Delete expired records
        run: python scripts/prune.py
      - name: Commit updated data
        run: |
          if ! git diff --quiet -- data/entries.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data/entries.json
            git commit -m 'Prune references older than 30 days'
            git push
          fi
