<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RAPPER JUNG. | DESIGN RADAR — 15 REFERENCES</title>
<style>
:root{--bg:#b4c1b4;--ink:#20382b;--accent:#315a43;--line:#9aab9d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,'Malgun Gothic',sans-serif}main{max-width:1300px;margin:auto;padding:30px 22px 70px}header{border-bottom:1px solid var(--line);padding-bottom:22px}h1{font-size:clamp(30px,5vw,60px);letter-spacing:-.06em;line-height:1.1;margin:7px 0}.eyebrow{font-size:11px;letter-spacing:.16em;color:var(--accent);font-weight:800}.muted,.status{color:#43584a}.status{font-size:12px}.topline{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin:25px 0 18px}.tabs{display:flex;flex-wrap:wrap;gap:7px}button{border:1px solid #8da594;background:#e8eee7;color:#294d37;padding:8px 11px;border-radius:8px;cursor:pointer}button[aria-selected=true]{background:var(--accent);color:white}.archive{margin:30px 0 36px;border-top:1px solid var(--line);padding-top:24px}.archive h2{font-size:clamp(20px,3vw,32px);letter-spacing:-.04em;margin:5px 0}.gallery{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}.tile{position:relative;background:white;border:1px solid var(--line);border-radius:9px;overflow:hidden;min-width:0}.tile a{display:block;aspect-ratio:4/5;overflow:hidden}.tile img{width:100%;height:100%;object-fit:cover;display:block;cursor:grab}.tile img:active{cursor:grabbing}.number{position:absolute;top:7px;left:7px;background:#fffffff0;padding:2px 7px;border-radius:5px;font-weight:800;font-size:12px;pointer-events:none}.missing{display:grid;place-items:center;height:100%;font-size:11px;color:#65776b;text-align:center;padding:6px}.details{margin-top:24px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 25px}.detail{border-top:1px solid var(--line);padding:12px 0}.detail h3{font-size:15px;margin:0 0 4px}.detail p{margin:3px 0;font-size:13px;color:#43584a}.detail a,.signal a{color:var(--accent);font-weight:700}.signals{margin-top:42px}.signal{padding:12px 0;border-top:1px solid var(--line)}.signal p{margin:3px 0;color:#43584a}.empty{padding:36px 10px;text-align:center;border:1px dashed var(--line);border-radius:10px}.footer{margin-top:50px;border-top:1px solid var(--line);padding-top:18px;font-size:12px;color:#43584a}@media(max-width:640px){main{padding:20px 12px 55px}.gallery{grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.details{grid-template-columns:1fr}.tile{border-radius:6px}.number{top:4px;left:4px;padding:1px 5px;font-size:10px}}
</style></head><body><main><header><div class="eyebrow">MINGUL STUDIO / DAILY DESIGN ARCHIVE</div><h1>RAPPER JUNG<span style="color:var(--accent)">.</span></h1><div class="muted">DESIGN RADAR — 오늘의 구체적인 디자인 아카이브</div><div class="status">원본 이미지의 저장·드래그는 제공 사이트 정책에 따라 제한될 수 있습니다.</div></header>
<div class="topline"><div><strong>최근 30일 아카이브</strong><div class="status" id="period"></div></div><nav class="tabs" id="tabs" aria-label="주차별 보기"></nav></div>
<div id="archives" aria-live="polite"></div><section class="signals"><h2>DESIGN SIGNALS ↗</h2><div id="signals"></div></section>
<footer class="footer">작품 이미지와 저작권은 원권리자에게 있습니다. · 공개 페이지에는 최근 30일 자료만 표시합니다. · 자동 게시 및 원본 저장소의 완전 삭제는 아직 연결·검증되지 않았습니다.<p id="status"></p></footer></main>
<script>
'use strict';
const DAY=86400000,$=s=>document.querySelector(s),mk=(t,c,v)=>{const e=document.createElement(t);if(c)e.className=c;if(v!==undefined)e.textContent=String(v);return e};
const safe=u=>{try{const x=new URL(u);return ['http:','https:'].includes(x.protocol)?x.href:null}catch{return null}};
const stamp=x=>Date.parse(x.date),recent=x=>Number.isFinite(stamp(x))&&stamp(x)<=Date.now()&&Date.now()-stamp(x)<30*DAY;
const monday=d=>{const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-(x.getDay()+6)%7);return x};
let entries=[],selected=0;
function normalize(raw){if(!Array.isArray(raw))throw Error('entries.json must be an array');return raw.filter(x=>x&&typeof x==='object'&&typeof x.date==='string'&&recent(x)&&typeof x.theme==='string'&&Array.isArray(x.references)&&x.references.length===15).sort((a,b)=>stamp(b)-stamp(a))}
function render(){
const base=monday(new Date()),tabs=$('#tabs');tabs.replaceChildren();
for(let i=0;i<5;i++){const b=mk('button','',i===0?'이번 주':i===1?'지난주':i+'주 전');b.type='button';b.setAttribute('aria-selected',String(selected===i));b.onclick=()=>{selected=i;render()};tabs.append(b)}
const start=new Date(base);start.setDate(start.getDate()-7*selected);const end=new Date(start.getTime()+7*DAY);
$('#period').textContent=start.toLocaleDateString('ko-KR')+' — '+new Date(end.getTime()-DAY).toLocaleDateString('ko-KR');
const selectedEntries=entries.filter(x=>stamp(x)>=start.getTime()&&stamp(x)<end.getTime());
const wrap=$('#archives');wrap.replaceChildren();
if(!selectedEntries.length)wrap.append(mk('div','empty','이 기간에 게시된 아카이브가 없습니다.'));
for(const day of selectedEntries){
const section=mk('section','archive'),date=mk('div','eyebrow',new Date(day.date).toLocaleDateString('ko-KR')),title=mk('h2','',day.theme),gallery=mk('div','gallery'),details=mk('div','details');
section.append(date,title,gallery,details);
day.references.forEach((ref,i)=>{
const tile=mk('div','tile'),link=mk('a'),num=mk('span','number',String(i+1).padStart(2,'0'));link.href=safe(ref.source_url)||'#';if(safe(ref.source_url)){link.target='_blank';link.rel='noopener noreferrer'}else link.removeAttribute('href');
const imageUrl=safe(ref.image_url);
if(imageUrl){const img=mk('img');img.src=imageUrl;img.alt=ref.title||'레퍼런스 이미지';img.loading='lazy';img.draggable=true;img.onerror=()=>img.replaceWith(mk('div','missing','IMAGE UNAVAILABLE'));link.append(img)}
else link.append(mk('div','missing','IMAGE NOT VERIFIED'));
tile.append(link,num);gallery.append(tile);
const d=mk('article','detail');d.append(mk('h3','',String(i+1).padStart(2,'0')+' · '+(ref.title||'제목 미확인')));
const meta=[ref.creator,ref.year].filter(v=>v!==null&&v!==undefined&&v!=='').join(' · ');if(meta)d.append(mk('p','',meta));
if(ref.reason)d.append(mk('p','',ref.reason));if(ref.visual_features)d.append(mk('p','',ref.visual_features));
if(safe(ref.source_url)){const a=mk('a','', '원본 출처 ↗');a.href=safe(ref.source_url);a.target='_blank';a.rel='noopener noreferrer';d.append(a)}
else d.append(mk('p','',ref.verification_reason||'출처 미확인'));
details.append(d);
});wrap.append(section)}
const signals=$('#signals');signals.replaceChildren();const trends=selectedEntries.flatMap(x=>Array.isArray(x.signals)?x.signals:[]);
if(!trends.length)signals.append(mk('div','empty','등록된 디자인 동향이 없습니다.'));
trends.forEach(s=>{const a=mk('article','signal');a.append(mk('strong','',s.title||'디자인 동향'),mk('p','',s.summary||''),mk('div','status',s.checked_at||'확인 날짜 미상'));if(safe(s.source_url)){const l=mk('a','', '출처 ↗');l.href=safe(s.source_url);l.target='_blank';l.rel='noopener noreferrer';a.append(l)}signals.append(a)});
$('#status').textContent='게시 아카이브 '+entries.length+'일 · 표시 '+selectedEntries.length+'일';
}
async function load(){try{const r=await fetch('./data/entries.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);entries=normalize(await r.json());render()}catch(e){console.warn('데이터 읽기 실패',e);$('#status').textContent='온라인 데이터를 불러오지 못했습니다.'}}
render();load();document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});
</script></body></html>
